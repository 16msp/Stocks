name: Daily price update

on:
  schedule:
    # GitHub starts scheduled jobs when it has capacity: hours late, or not at all on a busy day. The job only fetches what is missing,
    # so these extra slots cost almost nothing when an earlier one has already run.
    - cron: "30 11 * * 1-5"   # 17:00 IST, Mon-Fri, after the NSE close
    - cron: "30 13 * * 1-5"   # 19:00 IST, backup
    - cron: "30 16 * * 1-5"   # 22:00 IST, backup
    - cron: "30 2 * * 2-6"    # 08:00 IST next morning, catches a day that was missed
  workflow_dispatch:           # "Run workflow" button on the Actions tab

concurrency:
  group: daily-prices   # never two runs at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_prices.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSITIONS_SHEET_URL: ${{ secrets.POSITIONS_SHEET_URL }}
